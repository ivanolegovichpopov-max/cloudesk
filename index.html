<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://telegram.org; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://kgfhwjiexhwtxczjkgic.supabase.co wss://kgfhwjiexhwtxczjkgic.supabase.co; img-src 'self' data: blob: https://t.me https://*.telegram.org https://*.telesco.pe https://kgfhwjiexhwtxczjkgic.supabase.co; frame-src https://oauth.telegram.org; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Рабочий стол</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body data-wall="dusk">

<div id="wall" class="wall" aria-hidden="true"></div>

<!-- Экран входа -->
<main id="login" class="login" hidden>
  <div class="login-card">
    <div class="login-mark" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
    </div>
    <h1>Рабочий стол</h1>
    <button id="tg-login" class="btn-tg" type="button" data-tip="Сайт получает только имя, ник и фото. Переписка и контакты недоступны">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M21.9 4.3 18.6 19.9c-.2 1.1-.9 1.4-1.8.9l-5-3.7-2.4 2.3c-.3.3-.5.5-1 .5l.4-5.1 9.3-8.4c.4-.4-.1-.6-.6-.2L6 13.4l-4.9-1.5c-1.1-.3-1.1-1.1.2-1.6l19.1-7.4c.9-.3 1.7.2 1.5 1.4Z"/></svg>
      <span>Войти через Telegram</span>
    </button>
    <p id="login-msg" class="login-msg" role="status"></p>
  </div>
</main>

<!-- Рабочий стол -->
<div id="desk" class="desk" hidden>
  <header class="top">
    <button id="btn-clock" class="clock" type="button" data-tip="Календарь, таймер, секундомер, напоминания, города" aria-label="Календарь, таймер, секундомер, напоминания, города">
      <span id="clock-time" class="clock-time">--:--</span>
      <span id="clock-date" class="clock-date"></span>
      <span id="clock-run" class="clock-run" hidden></span>
    </button>
    <!-- Меню: одна кнопка, внутри группы с заголовками. Новые разделы добавляются отдельной группой -->
    <nav class="top-actions" aria-label="Меню">
      <!-- Поиск по столу: заметки, напоминания, ссылки -->
      <div id="search" class="search">
        <button type="button" id="search-open" class="top-btn search-open" data-tip="Поиск" aria-label="Поиск"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg></button>
        <div class="search-inner">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4"/></svg>
            <input id="search-input" type="text" placeholder="Поиск" autocomplete="off" spellcheck="false"
                   role="combobox" aria-expanded="false" aria-controls="search-pop" aria-autocomplete="list" aria-label="Поиск по заметкам, напоминаниям и ссылкам">
            <button type="button" id="search-clear" class="tool search-clear" aria-label="Очистить" hidden>
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></svg>
            </button>
          </div>
          <div id="search-pop" class="pop search-pop" role="listbox" hidden></div>
        </div>
        <button type="button" id="search-cancel" class="tool search-cancel" data-tip="Закрыть поиск" aria-label="Закрыть поиск"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 6l12 12M18 6 6 18"/></svg></button>
      </div>
      <div class="top-item">
        <button id="btn-linkmenu" class="top-btn" data-tip="Ссылки" aria-label="Ссылки" type="button" aria-haspopup="menu" aria-expanded="false" data-menu="links-menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
          <svg class="chev top-chev" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="links-menu" class="menu" role="menu" hidden>
          <div id="links-menu-list" class="menu-group"></div>
          <div class="menu-group">
            <button type="button" id="links-edit-btn" class="menu-item" role="menuitem">
              <span class="menu-ico"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 20h4L19 9l-4-4L4 16zM13 7l4 4"/></svg>Настроить ссылки</span>
              <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
      <div class="top-item">
        <button id="btn-menu" class="top-btn" data-tip="Меню" aria-label="Меню" type="button" aria-haspopup="menu" aria-expanded="false" data-menu="main-menu">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <div id="main-menu" class="menu" role="menu" hidden>
          <div class="menu-who">
            <span id="user-ava" class="ava"></span>
            <div class="menu-who-text"><b id="user-name"></b><span id="user-handle"></span></div>
          </div>

          <div class="menu-group">
            <div class="menu-label">Оформление</div>
            <button id="btn-wall" type="button" class="menu-item" role="menuitem">
              <span class="menu-ico"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v14H4zM4 16l5-5 4 4 3-3 4 4M15 9.5h.01"/></svg>Заставка</span>
              <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
            </button>
            <div class="menu-row">
              <span class="menu-ico"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 1 0 0 18zM12 3a9 9 0 0 1 0 18"/></svg>Тема</span>
              <div class="segmented" role="radiogroup" aria-label="Тема оформления">
                <button type="button" role="radio" data-theme-set="auto" data-tip="Как на устройстве" aria-label="Как на устройстве">Авто</button>
                <button type="button" role="radio" data-theme-set="light">Светлая</button>
                <button type="button" role="radio" data-theme-set="dark">Тёмная</button>
              </div>
            </div>
          </div>

          <div class="menu-group">
            <div class="menu-label">Стол</div>
            <button id="btn-links" type="button" class="menu-item" role="menuitem">
              <span class="menu-ico"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>Быстрые ссылки</span>
              <svg class="chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg>
            </button>
          </div>

          <div class="menu-group">
            <div class="menu-label">Аккаунт</div>
            <button id="btn-logout" class="menu-item" type="button" role="menuitem">
              <span class="menu-ico"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>Выйти</span>
            </button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <section class="board" aria-labelledby="notes-h">
    <div class="board-head">
      <h2 id="notes-h">Заметки <span id="notes-count" class="count"></span></h2>
      <button id="btn-new" class="icon-primary" type="button" data-tip="Новая заметка" aria-label="Новая заметка">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    <div id="notes" class="notes"></div>
    <div id="notes-empty" class="empty" hidden>
      <p>Заметок нет</p>
    </div>
    <div id="notes-loading" class="empty">
      <p>Загрузка…</p>
    </div>
  </section>
</div>

<!-- Редактор заметки -->
<div id="editor" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet note-sheet" role="dialog" aria-modal="true" aria-label="Заметка">
    <div class="sheet-bar">
      <h3 id="ed-title">Заметка</h3>
      <div class="sheet-tools">
        <span id="ed-status" class="ed-status" role="status"></span>
        <button type="button" class="tool done" data-close data-tip="Готово" aria-label="Готово"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      </div>
    </div>
    <label class="sr" for="ed-body">Текст заметки</label>
    <textarea id="ed-body" class="ed-body" maxlength="20000" placeholder="Заметка"></textarea>
    <div class="sheet-foot">
      <div class="colors" role="radiogroup" aria-label="Цвет заметки">
        <button type="button" class="dot" data-color="paper" aria-label="Бумага"></button>
        <button type="button" class="dot" data-color="sky" aria-label="Голубой"></button>
        <button type="button" class="dot" data-color="mint" aria-label="Мятный"></button>
        <button type="button" class="dot" data-color="rose" aria-label="Розовый"></button>
        <button type="button" class="dot" data-color="sand" aria-label="Песочный"></button>
        <button type="button" class="dot" data-color="ink" aria-label="Тёмный"></button>
      </div>
      <div id="ed-actions" class="foot-actions">
        <button id="ed-pin" type="button" class="tool" aria-pressed="false" data-tip="Закрепить сверху" aria-label="Закрепить сверху">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" d="M9 3h6l-1 6 4 4H6l4-4zM12 13v8"/></svg>
        </button>
        <button id="ed-delete" type="button" class="tool" data-tip="Удалить" aria-label="Удалить">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
        </button>
      </div>
      <div id="ed-confirm" class="confirm foot-actions" hidden>
        <span>Удалить?</span>
        <button id="ed-confirm-no" type="button" class="tool" data-tip="Отмена" aria-label="Отмена"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M9 14l-4-4 4-4M5 10h9a5 5 0 0 1 0 10h-2"/></svg></button>
        <button id="ed-confirm-yes" type="button" class="tool danger" data-tip="Удалить" aria-label="Удалить"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
      </div>
    </div>
  </div>
</div>

<!-- Выбор заставки -->
<div id="wallsheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="wall-h">
    <div class="sheet-bar">
      <h3 id="wall-h">Заставка</h3>
      <button type="button" class="tool done" data-close data-tip="Готово" aria-label="Готово"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
    </div>
    <div id="presets" class="presets">
    </div>
    <input id="wall-file" type="file" accept="image/jpeg,image/png,image/webp" class="sr">
    <div class="sheet-foot">
      <span id="wall-status" class="ed-status" role="status"></span>
      <div class="foot-actions">
        <label class="tool" for="wall-file" data-tip="Загрузить своё фото" aria-label="Загрузить своё фото"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg></label>
      </div>
    </div>
  </div>
</div>

<!-- Время: календарь, таймер, секундомер, напоминания, города -->
<div id="timesheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="time-h">
    <div class="sheet-bar">
      <h3 id="time-h">Время</h3>
      <div class="sheet-tools">
        <span id="time-status" class="ed-status" role="status"></span>
        <button type="button" class="tool done" data-close data-tip="Готово" aria-label="Готово"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="Разделы">
      <button type="button" role="tab" data-tab="cal" data-tip="Календарь" aria-label="Календарь"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg></button>
      <button type="button" role="tab" data-tab="timer" data-tip="Таймер" aria-label="Таймер"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9s8 4 8 9"/></svg></button>
      <button type="button" role="tab" data-tab="sw" data-tip="Секундомер" aria-label="Секундомер"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 8a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM12 12v3M10 2h4M12 2v3"/></svg></button>
      <button type="button" role="tab" data-tab="rem" data-tip="Напоминания" aria-label="Напоминания"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button>
      <button type="button" role="tab" data-tab="cities" data-tip="Города" aria-label="Города"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
    </div>

    <section class="tab-panel cal" data-panel="cal" role="tabpanel">
      <div class="cal-head">
        <button type="button" class="tool" id="cal-prev" data-tip="Предыдущий месяц" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg></button>
        <div id="cal-title" class="cal-title"></div>
        <button type="button" class="tool" id="cal-next" data-tip="Следующий месяц" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
    </section>

    <section class="tab-panel center" data-panel="timer" role="tabpanel" hidden>
      <div id="timer-display" class="big-time">05:00</div>
      <div class="chips" id="timer-presets"></div>
      <div class="timer-custom">
        <input id="timer-min" type="number" min="1" max="600" step="1" inputmode="numeric" placeholder="Своё, мин" aria-label="Своё время в минутах">
      </div>
    </section>

    <section class="tab-panel center" data-panel="sw" role="tabpanel" hidden>
      <div id="sw-display" class="big-time">00:00,0</div>
      <ol id="sw-laps" class="laps"></ol>
    </section>

    <section class="tab-panel" data-panel="rem" role="tabpanel" hidden>
      <form id="rem-form" class="rem-form" novalidate>
        <label class="sr" for="rem-text">Текст напоминания</label>
        <input id="rem-text" type="text" maxlength="500" placeholder="Напоминание" autocomplete="off">
        <div class="rem-when">
          <input id="rem-date" type="hidden">
          <input id="rem-time" type="hidden">
          <div class="field">
            <button type="button" id="rem-date-btn" class="pick-btn" aria-haspopup="dialog" aria-expanded="false" data-menu="rem-date-pop">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/></svg>
              <span id="rem-date-label">Дата</span>
            </button>
            <div id="rem-date-pop" class="pop pop-cal" hidden>
              <div class="cal-head">
                <button type="button" class="tool" id="dp-prev" data-tip="Предыдущий месяц" aria-label="Предыдущий месяц"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M15 6l-6 6 6 6"/></svg></button>
                <div id="dp-title" class="cal-title"></div>
                <button type="button" class="tool" id="dp-next" data-tip="Следующий месяц" aria-label="Следующий месяц"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M9 6l6 6-6 6"/></svg></button>
              </div>
              <div id="dp-grid" class="dp-grid"></div>
            </div>
          </div>
          <div class="field">
            <button type="button" id="rem-time-btn" class="pick-btn" aria-haspopup="dialog" aria-expanded="false" data-menu="rem-time-pop">
              <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM12 7v5l3 2"/></svg>
              <span id="rem-time-label">Время</span>
            </button>
            <div id="rem-time-pop" class="pop pop-time" hidden>
              <div class="tp-col"><div class="tp-head">Часы</div><div id="tp-hours" class="tp-list"></div></div>
              <div class="tp-col"><div class="tp-head">Минуты</div><div id="tp-mins" class="tp-list"></div></div>
            </div>
          </div>
        </div>
      </form>
      <ul id="rem-list" class="rem-list"></ul>
      <p id="rem-empty" class="empty" hidden>Напоминаний нет</p>
    </section>

    <section class="tab-panel" data-panel="cities" role="tabpanel" hidden>
      <ul id="city-list" class="city-list"></ul>
    </section>

    <div class="sheet-foot">
      <span id="time-hint" hidden></span>
      <div class="foot-actions">
        <span class="foot-tools" data-for="cal"><button type="button" id="cal-today" class="tool" data-tip="Сегодня" aria-label="Сегодня"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4M11 14h2v2h-2z"/></svg></button></span>
        <span class="foot-tools" data-for="timer" hidden><button type="button" id="timer-reset" class="tool" data-tip="Сброс" aria-label="Сброс"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 4v6h6M5.6 15a8 8 0 1 0 1.8-8.4L4 10"/></svg></button><button type="button" id="timer-go" class="tool accent" data-tip="Старт" aria-label="Старт"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 5v14l11-7z"/></svg></button></span>
        <span class="foot-tools" data-for="sw" hidden><button type="button" id="sw-reset" class="tool" data-tip="Сброс" aria-label="Сброс"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 4v6h6M5.6 15a8 8 0 1 0 1.8-8.4L4 10"/></svg></button><button type="button" id="sw-lap" class="tool" data-tip="Круг" aria-label="Круг" disabled><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M5 21V4M5 4h11l-2 4 2 4H5"/></svg></button><button type="button" id="sw-go" class="tool accent" data-tip="Старт" aria-label="Старт"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M8 5v14l11-7z"/></svg></button></span>
        <span class="foot-tools" data-for="rem" hidden><button type="button" id="rem-add" class="tool accent" data-tip="Добавить напоминание" aria-label="Добавить напоминание"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg></button></span>
        <span class="foot-tools" data-for="cities" hidden>
          <span class="field"><button type="button" id="city-add" class="tool" data-tip="Добавить город" aria-label="Добавить город" aria-haspopup="listbox" aria-expanded="false" data-menu="city-pop"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg></button>
            <div id="city-pop" class="pop pop-up pop-end" role="listbox" hidden></div>
          </span>
        </span>
      </div>
    </div>
  </div>
</div>

<!-- Быстрые ссылки: настройка -->
<div id="linksheet" class="sheet-wrap" hidden>
  <div class="sheet-backdrop" data-close></div>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="links-h">
    <div class="sheet-bar">
      <h3 id="links-h">Быстрые ссылки</h3>
      <div class="sheet-tools">
        <span id="links-status" class="ed-status" role="status"></span>
        <button type="button" class="tool done" data-close data-tip="Готово" aria-label="Готово"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
      </div>
    </div>
    <div class="links-edit">
      <div id="links-list" class="links-list"></div>
    </div>
    <div class="sheet-foot">
      <span class="foot-spacer"></span>
      <div class="foot-actions">
        <button type="button" id="links-new" class="tool accent" data-tip="Добавить ссылку" aria-label="Добавить ссылку"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M12 5v14M5 12h14"/></svg></button>
        <button type="button" id="groups-new" class="tool" data-tip="Добавить группу" aria-label="Добавить группу"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M3 7h6l2 2h10v10H3zM12 12v5M9.5 14.5h5"/></svg></button>
      </div>
    </div>
  </div>
</div>

<!-- выбор группы для ссылки (вне окна, чтобы список не обрезался прокруткой) -->
<div id="lg-pop" class="pop lg-pop" role="listbox" hidden></div>

<div id="toast" class="toast" role="alert" hidden></div>

<script src="app.js"></script>
